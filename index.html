    <script>
      /* Apply the persisted theme before first paint so a static load never
         flashes the wrong theme. Mirrors the next-themes config in App.tsx
         (storage key "theme", defaultTheme "dark", system enabled). */
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored === 'dark' || (stored === 'system' && systemDark) || !stored;
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
